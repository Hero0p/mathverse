{% extends "base.html" %}
{% block title %}Sign up — MathVerse{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-4 py-16">
  <h1 class="text-2xl font-bold mb-6">Create your account</h1>
  <form method="post" class="space-y-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input name="username" type="text" placeholder="Display name" class="w-full px-3 py-2 rounded bg-panel2 border border-white/10">
    <input name="email" type="email" required placeholder="Email" class="w-full px-3 py-2 rounded bg-panel2 border border-white/10">
    <input name="password" type="password" required minlength="8" placeholder="Password (8+ characters)" class="w-full px-3 py-2 rounded bg-panel2 border border-white/10">
    <button type="submit" class="btn-primary w-full">Sign up</button>
  </form>
  <p class="text-sm text-slate-400 mt-4">
    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-accent2">Log in</a>
    or <form class="inline" method="post" action="{{ url_for('auth.guest') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="text-accent2 underline">continue as guest</button></form>.
  </p>
</div>
{% endblock %}

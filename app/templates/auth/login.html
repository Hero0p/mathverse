{% extends "base.html" %}
{% block title %}Log in — MathVerse{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-4 py-16">
  <h1 class="text-2xl font-bold mb-6">Log in</h1>
  <form method="post" class="space-y-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input name="email" type="email" required placeholder="Email" class="w-full px-3 py-2 rounded bg-panel2 border border-white/10">
    <input name="password" type="password" required placeholder="Password" class="w-full px-3 py-2 rounded bg-panel2 border border-white/10">
    <button type="submit" class="btn-primary w-full">Log in</button>
  </form>
  <p class="text-sm text-slate-400 mt-4">
    No account? <a href="{{ url_for('auth.register') }}" class="text-accent2">Sign up</a>
    or <form class="inline" method="post" action="{{ url_for('auth.guest') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="text-accent2 underline">continue as guest</button></form>.
  </p>
</div>
{% endblock %}
